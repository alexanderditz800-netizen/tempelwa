<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar · Tempel WA</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(37, 211, 102, 0.06) 0%, transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(37, 211, 102, 0.03) 0%, transparent 50%);
            animation: rotate 60s linear infinite;
            z-index: 0;
        }
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .register-container {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 1;
        }
        .register-card {
            background: rgba(16, 22, 40, 0.92);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 40px 32px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            max-height: 90vh;
            overflow-y: auto;
        }
        .register-card::-webkit-scrollbar { width: 4px; }
        .register-card::-webkit-scrollbar-track { background: transparent; }
        .register-card::-webkit-scrollbar-thumb { background: rgba(37, 211, 102, 0.3); border-radius: 10px; }

        .register-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .register-header .icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 12px 40px rgba(37, 211, 102, 0.2);
            margin-bottom: 12px;
        }
        .register-header h1 {
            font-size: 26px;
            font-weight: 800;
            color: white;
            letter-spacing: -0.5px;
        }
        .register-header p {
            color: #8892b0;
            font-size: 14px;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            color: #8892b0;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group label .required { color: #ff4444; }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(10, 14, 26, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: #e6edff;
            font-size: 15px;
            font-weight: 500;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.3s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #25D366;
            box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.08);
        }
        .form-group input::placeholder { color: #4a5578; font-weight: 400; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-register {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 17px;
            font-weight: 700;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(37, 211, 102, 0.3);
        }
        .btn-register:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            color: #ff4444;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
        .error-msg.show { display: block; animation: shake 0.5s; }
        .success-msg {
            color: #25D366;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
        .success-msg.show { display: block; animation: slideUp 0.5s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #4a5578;
            font-size: 14px;
        }
        .login-link a {
            color: #25D366;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link a:hover { text-decoration: underline; }

        .referral-info {
            background: rgba(255, 193, 7, 0.05);
            border: 1px solid rgba(255, 193, 7, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            color: #ffc107;
            font-size: 13px;
        }
        .referral-info i { margin-right: 8px; }

        @media (max-width: 480px) {
            .register-card { padding: 28px 18px; border-radius: 28px; }
            .register-header h1 { font-size: 22px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <div class="icon">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1>Daftar Akun</h1>
                <p>Mulai menghasilkan uang dari WhatsApp</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Username <span class="required">*</span></label>
                    <input type="text" id="username" placeholder="Masukkan username" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password <span class="required">*</span></label>
                    <input type="password" id="password" placeholder="Minimal 6 karakter" minlength="6" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-phone"></i> Nomor WhatsApp <span class="required">*</span></label>
                    <input type="text" id="phone" placeholder="08123456789" required>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-university"></i> Nama Bank <span class="required">*</span></label>
                    <input type="text" id="bank_name" placeholder="Contoh: BCA, Mandiri, BNI" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-credit-card"></i> No. Rekening <span class="required">*</span></label>
                        <input type="text" id="bank_account" placeholder="1234567890" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Nama Pemilik <span class="required">*</span></label>
                        <input type="text" id="bank_holder" placeholder="Nama lengkap" required>
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-link"></i> Kode Referral (Opsional)</label>
                    <input type="text" id="referral_code" placeholder="Masukkan kode referral" style="text-transform: uppercase;">
                </div>

                <div class="referral-info">
                    <i class="fas fa-gift"></i> Dapatkan bonus Rp 1.000 untuk setiap referral!
                </div>

                <div class="error-msg" id="errorMsg">
                    <i class="fas fa-exclamation-circle"></i> <span id="errorText">Error</span>
                </div>

                <div class="success-msg" id="successMsg">
                    <i class="fas fa-check-circle"></i> <span id="successText">Registrasi berhasil!</span>
                </div>

                <button type="submit" class="btn-register" id="registerBtn">
                    <i class="fas fa-arrow-right"></i> Daftar Sekarang
                </button>
            </form>

            <div class="login-link">
                Sudah punya akun? <a href="/login">Login di sini</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value.trim();
            const bank_name = document.getElementById('bank_name').value.trim();
            const bank_account = document.getElementById('bank_account').value.trim();
            const bank_holder = document.getElementById('bank_holder').value.trim();
            const referral_code = document.getElementById('referral_code').value.trim().toUpperCase();
            
            const btn = document.getElementById('registerBtn');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            
            if (!username || !password || !phone || !bank_name || !bank_account || !bank_holder) {
                errorMsg.classList.add('show');
                document.getElementById('errorText').textContent = 'Semua field wajib diisi!';
                return;
            }
            
            if (password.length < 6) {
                errorMsg.classList.add('show');
                document.getElementById('errorText').textContent = 'Password minimal 6 karakter!';
                return;
            }
            
            const cleanPhone = phone.replace(/\D/g, '');
            if (cleanPhone.length < 8) {
                errorMsg.classList.add('show');
                document.getElementById('errorText').textContent = 'Nomor tidak valid!';
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Memproses...';
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');
            
            try {
                const resp = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        password,
                        phone: cleanPhone,
                        bank_name,
                        bank_account,
                        bank_holder,
                        referral_code
                    })
                });
                
                const data = await resp.json();
                
                if (data.success) {
                    successMsg.classList.add('show');
                    document.getElementById('successText').textContent = 
                        `✅ Registrasi berhasil! Kode referral Anda: ${data.referral_code}`;
                    
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 3000);
                } else {
                    errorMsg.classList.add('show');
                    document.getElementById('errorText').textContent = data.message;
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-arrow-right"></i> Daftar Sekarang';
                }
            } catch (e) {
                errorMsg.classList.add('show');
                document.getElementById('errorText').textContent = 'Error koneksi!';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-arrow-right"></i> Daftar Sekarang';
            }
        });

        document.getElementById('referral_code').addEventListener('input', function() {
            this.value = this.value.toUpperCase();
        });

        document.getElementById('phone').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });
    </script>
</body>
</html>
